        a {
            text-decoration: none;
            border-radius: 4px;
        }
        a:hover{
            background-color: green;
            color: whitesmoke;
        }  
          table {
  width: 100%;
  border-collapse: collapse;
  font-family: sans-serif;
}

caption {
  font-weight: bold;
  margin-bottom: 10px;
  text-align: left;
}

th, td {
  padding: 12px 15px;
  text-align: left;
  border-bottom: 1px solid lightgray;

thead th {
  background-color: whitesmoke;
  border-bottom: 2px solid silver;

<body>
    <h1>Employee List</h1>
    <table border="2">
        <thead>
            <th>Id</th>
            <th>Name</th>
            <th>Email</th>
            <th>Dept</th>
            <th>Salary</th>
            <th>Action</th>
        </thead>
        {% for emp in employee %}
        <tr>
            <td>{{emp.id}}</td>
            <td>{{emp.name}}</td>
            <td>{{emp.email}}</td>
            <td>{{emp.dept}}</td>
            <td>{{emp.salary}}</td>
            <td>
                <a href="{% url 'employee_details' emp.pk %}" style="background-color: orange; padding: 6px;">
                    view
                </a> &nbsp;  <a href="{% url 'update_employee' emp.pk %}" style="width: 10px; padding: 6px; background-color: green;">
                    update
                </a> &nbsp;
                <a href="{% url 'delete_employee' emp.pk %}" style="width: 10px; background-color: red; padding: 6px;">delete</a>
            </td>
        </tr>
        {% endfor %}
    </table>
    
</body>
